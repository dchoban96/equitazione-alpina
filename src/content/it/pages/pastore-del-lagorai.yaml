  - type: "text-image"
    kicker: "Il lavoro"
    heading: "Un cane da lavoro"
    body: |
      Il Pastore del Lagorai, che di nome completo fa Cane da Pastore della Lessinia e del Lagorai, è un cane da conduzione: il suo mestiere è guidare e custodire il gregge. Lo si usa con pecore e capre, ma anche con animali più difficili da governare, come le mucche e i cavalli. Da noi fa proprio questo, ogni giorno, accanto ai cavalli e alle capre.

      Della sua storia e del suo carattere parliamo nella pagina [La razza](/pastore-del-lagorai/razza/).
