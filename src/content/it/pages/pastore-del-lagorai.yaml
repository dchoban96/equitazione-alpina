    title: "Pastore del Lagorai, i cani del recinto"
    intro: |
      Al recinto il cane arriva sempre prima di tutti: corre avanti, accompagna i cavalli, conosce ogni sentiero. I nostri sono Pastori del Lagorai, una razza da lavoro delle Alpi del Nord-Est che da sempre segue greggi e mandrie nella transumanza.

      I nostri cani non sono in vendita e non vendiamo cuccioli: questa sezione racconta la razza e il lavoro dei cani con gli animali.
    image: "../../../assets/pastore-del-lagorai/pastore-blue-merle-al-recinto.jpg"
