  - type: "hero"
    kicker: "Pastore della Lessinia e del Lagorai"
    title: "Pastore della Lessinia e del Lagorai, i cani del recinto"
    intro: |-
      Al recinto il cane arriva sempre prima di tutti: corre avanti, accompagna i cavalli, conosce ogni sentiero. I nostri sono Pastori della Lessinia e del Lagorai, antica razza da gregge delle montagne del Nord-Est che da generazioni segue greggi e mandrie nella transumanza.
    image: "@assets/foto/pastore-blue-merle-al-recinto.jpg"
    imageAlt: "Un Pastore della Lessinia e del Lagorai grigio merle in piedi sul prato, davanti a un muretto di pietra"
  - type: "text-image"
    kicker: "Il lavoro"
    heading: "Un cane da lavoro"
    body: |
      Il cane da Pastore della Lessinia e del Lagorai è un cane da conduzione: il suo mestiere è guidare e custodire il gregge. Lo si usa con pecore e capre, ma anche con animali più difficili da governare, come le mucche e i cavalli. Da noi fa proprio questo, ogni giorno, accanto ai cavalli e alle capre: segue chi lo guida, ma sa anche decidere da solo quando serve.

      Della sua storia, del suo carattere e delle colorazioni del mantello parliamo nella pagina [La razza](/pastore-del-lagorai/razza/).
    image: "@assets/foto/pastore-blue-merle-seduto.jpg"
    alt: "Kuma, Pastore della Lessinia e del Lagorai grigio merle"
    side: "right"
