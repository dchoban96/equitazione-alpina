        value: "1995 ca."
      - label: "Base"
        value: "Albosaggia (SO)"
      - label: "Sede estiva"
        value: "Valmalenco"
      - label: "Età minima"
        value: "3 anni"
  - type: "text-image"
    kicker: "Gli animali"
    heading: "Cavalli che vivono fuori"
    body: |
      I nostri cavalli non stanno in box tutto il giorno. Vivono all'aperto, in gruppo, su terreno in pendenza — il che significa zoccoli buoni, muscoli veri e caratteri che non si appiattiscono.

      D'estate ci sono le mosche e il fango dopo i temporali, perché è così che vivono i cavalli quando li si lascia essere cavalli.

      Ogni tanto nasce un puledro, e per qualche settimana tutto il resto passa in secondo piano.
    image: "../../../assets/equitazione/mockup-cavalli-recinto.jpg"
    alt: "Illustrazione di prova: due cavalli al pascolo vicino al recinto"
    side: "right"
