  - type: "hero"
    kicker: "Pensione"
    title: "Pensione cavalli, in box e all'aperto"
    intro: |-
      Per cavalli di proprietà, in paddock dedicati e box interni.
    image: "@assets/foto/cavalli-nella-neve.jpg"
    imageAlt: "Tre cavalli fuori nel recinto innevato, d'inverno"
  - type: "text-image"
    kicker: "I paddock"
    heading: "Paddock dedicati e box interni"
    lead: "I cavalli di proprietà, in paddock dedicati e box interni."
    body: |
      Il paddock è un recinto all'aperto riservato al cavallo: uno spazio delimitato dove può muoversi liberamente ogni giorno, al passo che decide lui. Per chi tiene il proprio cavallo in pensione ad Albosaggia, vicino a Sondrio, ogni cavallo di proprietà ha il suo paddock dedicato e il suo box interno.

      I vantaggi si vedono presto. Un cavallo che passa le giornate fuori si muove di più, e il movimento fa bene a zoccoli, articolazioni e digestione. Respira aria aperta invece della polvere della scuderia. Vede e sente gli altri cavalli, e questo lo tiene tranquillo: meno noia, meno stress, meno vizi di scuderia.

      Il paddock dedicato permette anche di seguire ogni cavallo per conto suo: la sua razione di fieno, i suoi tempi, le sue esigenze.

      Il box interno completa il quadro: un riparo asciutto per la notte, per il maltempo e per i momenti in cui il cavallo ha bisogno di riposo o di cure.
    image: "@assets/foto/scuderia-box-interni.jpg"
    alt: "Il corridoio della scuderia con i box interni in muratura rossa, le porte in legno e i finimenti appesi alla parete"
    side: "right"
  - type: "text-image"
    kicker: "Come vivono"
    heading: "Cavalli che vivono fuori"
    body: |
      I nostri cavalli non stanno in box tutto il giorno. Vivono all'aperto circondati da alberi di castagno, in gruppo, su terreni spesso in pendenza — il che significa zoccoli buoni e una musculatura più funzionale e resistente.

      D'estate ci sono le mosche e il fango dopo i temporali, perché è così che vivono i cavalli quando li si lascia essere cavalli.

      Ogni tanto nasce un puledro, e per qualche settimana tutto il resto passa in secondo piano.
    image: "@assets/foto/foto-img-3479.jpg"
    alt: "Tre cavalli sul prato verde, ai piedi del bosco di castagno"
    side: "left"
