    kicker: "Guida alla Valtellina"
    title: "Cibo e vino della Valtellina"
    intro: |
      La cucina della Valtellina nasce da poche cose, quelle che la montagna concedeva: grano saraceno, patate, verze, latte. Da lì vengono i pizzoccheri, gli sciatt e la polenta taragna, e due formaggi che si fanno da secoli, uno in alpeggio e uno a valle. Sul versante al sole, intanto, i muretti a secco reggono le vigne del Nebbiolo. In queste pagine raccontiamo che cosa c'è nel piatto e nel bicchiere, e da dove viene.
