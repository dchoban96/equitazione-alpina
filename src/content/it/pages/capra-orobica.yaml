  - type: "text-image"
    kicker: "L'allevamento"
    heading: "Perché la Capra Orobica"
    body: |
      L'Orobica è una capra rustica, fatta per i pascoli ripidi: sta bene dove altre razze farebbero fatica. Negli ultimi decenni è stata messa da parte da capre più produttive, e il numero dei capi è sceso molto. Oggi è un Presidio Slow Food, e chi la alleva lo fa anche per tenerla viva dove è nata.

      Si alleva come una volta: al pascolo in primavera e in autunno, in alpeggio d'estate.

      Di corna, mantelli e formaggi parliamo nella pagina [La razza](/capra-orobica/razza/).
    image: "@assets/foto/mockup-capre-pascolo.jpg"
