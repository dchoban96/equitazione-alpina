  - type: "text-image"
    kicker: "Come si va"
    heading: "Andare al passo"
    body: |
      Qui non si corre. Non perché non si possa, ma perché la montagna e i cavalli chiedono un'altra andatura.

      Chi non è mai salito in sella comincia da terra: si conosce l'animale, si impara a stargli accanto, si sale quando si è pronti. Chi monta da anni trova sentieri che meritano la giornata intera.

      In sella si sale dai 12 anni in su, e il ritmo lo decide chi impara: la prima volta può bastare stare accanto al cavallo, ed è già un buon inizio.
    image: "@assets/foto/passeggiata-a-cavallo-sul-sentiero.jpg"
    alt: "Due cavalieri al passo su una strada sterrata fra gli abeti, con le montagne sullo sfondo"
    side: "left"
    note: "al passo"
  - type: "text-image"
    kicker: "Gli animali"
    heading: "Cavalli che vivono fuori"
    body: |
      I nostri cavalli non stanno chiusi in box. Vivono all'aperto, in gruppo, sul prato in pendenza ai piedi del bosco: il che significa zoccoli buoni, muscoli veri e caratteri tranquilli.

      Si muovono, si cercano, si riposano all'ombra degli alberi. È così che vivono i cavalli quando li si lascia essere cavalli.

      Ogni tanto nasce un puledro, e per qualche settimana tutto il resto passa in secondo piano.
    image: "@assets/foto/cavalli-sul-prato-in-estate.jpg"
    alt: "Due cavalli sauri con la lista bianca e un cavallo grigio sul prato verde in pendenza, ai piedi del bosco"
    side: "right"
    note: "recinto"
