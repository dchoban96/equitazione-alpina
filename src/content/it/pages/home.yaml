        altitude: 1300
        approximate: true
        text: "È la casa: boschi di castagno e faggio, sentieri che salgono verso San Bernardo e il Lago Casera, la Valtellina che si apre sotto man mano che si guadagna quota. D'inverno con il fiato che si vede, d'autunno con le foglie che scivolano sotto gli zoccoli."
        season: "Tutto l'anno"
      - name: "La Valmalenco"
        altitude: 1950
        approximate: true
        text: "Quando la neve libera i pascoli alti si sale verso l'Alpe Palù. Sono poche settimane, diverse da tutto il resto dell'anno: pascoli aperti, granito chiaro, silenzio."
        season: "Da fine giugno a inizio settembre"
  - type: "text-image"
    kicker: "Come si va"
    heading: "Andare al passo"
    body: |
      Qui non si corre. Non perché non si possa, ma perché la montagna e i cavalli chiedono un'altra andatura.

      Chi non è mai salito in sella comincia da terra: si conosce l'animale, si impara a stargli accanto, si sale quando si è pronti. Chi monta da anni trova sentieri che meritano la giornata intera.

      I bambini possono avvicinarsi ai cavalli da tre anni, condotti a mano, per il tempo che serve — dieci minuti bastano, se sono i dieci minuti giusti.
    image: "../../../assets/equitazione/mockup-lezione-maneggio.jpg"
