  - type: "hero"
    kicker: "Guida alla Valtellina"
    title: "Formaggi"
    intro: |
      In Valtellina il formaggio segue le stagioni. D'estate le mandrie salgono agli alpeggi e il latte si lavora lassù, appena munto: è il tempo del Bitto. Per il resto dell'anno gli animali stanno a valle e il latte di più stalle arriva nelle latterie, dove nasce il Valtellina Casera. Sono due formaggi diversi, figli delle stesse montagne, ed entrambi hanno la Denominazione di Origine Protetta dal 1996.
    image: "../../../assets/valtellina/mockup-formaggi.jpg"
    imageAlt: "Illustrazione di prova: forme di formaggio su un tavolo"
  - type: "text"
    kicker: "D'alpeggio"
    heading: "Bitto"
    body: |
      Il Bitto si fa solo d'estate, dal 1° giugno al 30 settembre, quando le vacche pascolano in quota sugli alpeggi della provincia di Sondrio e di alcune zone confinanti. Il latte è intero e crudo, e si lavora subito dopo la mungitura, sul posto.

      Al latte di vacca si può aggiungere latte di capra, fino a un massimo del 10%: sono le capre che da sempre salgono in alpeggio insieme alle mandrie, e il loro latte rende l'aroma più deciso.

      La cagliata viene cotta, messa nelle fascere che danno alla forma il suo bordo concavo e salata a secco. Le forme pesano da 8 a 25 chili e stagionano almeno 70 giorni: cominciano nelle casere d'alpe e finiscono a fondovalle. Da giovane il Bitto è dolce e delicato; con il tempo diventa più intenso, e alcune forme vengono lasciate maturare per anni.

      Nelle valli di Gerola e di Albaredo alcuni produttori seguono regole ancora più strette. Il loro formaggio si chiama Storico Ribelle, è un Presidio Slow Food, e il latte di capra è obbligatorio: deve venire da capre di razza Orobica. È la stessa razza che alleviamo noi: vedi la sezione [Capra Orobica](/capra-orobica/).
  - type: "text"
    kicker: "Di latteria"
    heading: "Valtellina Casera"
    body: |
      Il Valtellina Casera è il formaggio di tutti i giorni. Le sue origini risalgono al Cinquecento, alle latterie turnarie e sociali dove più allevatori mettevano insieme il latte per lavorarlo in comune. Un tempo si faceva d'inverno, quando il bestiame era sceso a valle; oggi si produce tutto l'anno, in tutta la provincia di Sondrio.

      Il latte è di vacca, di due o più mungiture, e viene in parte scremato prima della lavorazione: per questo il Casera è un formaggio semigrasso. La cagliata si cuoce a una temperatura più bassa rispetto al Bitto, la forma viene pressata e poi stagiona per almeno 70 giorni. Le forme pesano da 7 a 12 chili e hanno il bordo diritto.

      Da giovane è dolce e sa di latte; stagionando prende note di frutta secca e un profumo di fieno. Il nome viene dalla casera, il locale dove i formaggi si lavorano e si lasciano maturare.

      In cucina è il formaggio dei pizzoccheri e degli sciatt: ne parliamo nella pagina dei [piatti tipici](/valtellina/cibo-e-vino/piatti-tipici/).
