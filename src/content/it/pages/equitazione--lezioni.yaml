    intro: |
      Alla scuola di equitazione di Albosaggia non si comincia dalla sella. Chi non è mai salito a cavallo parte da terra: conosce l'animale, impara a stargli accanto e a condurlo, e sale quando è pronto. Vale per gli adulti come per i bambini, che possono avvicinarsi ai cavalli già da tre anni. Le lezioni si fanno in struttura, su appuntamento, e il ritmo lo decidono insieme chi impara e il cavallo.
