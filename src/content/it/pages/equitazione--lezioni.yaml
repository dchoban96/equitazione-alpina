  - type: "text"
    kicker: "Il metodo"
    heading: "Perché si parte da terra"
    body: |
      Un cavallo si fida di chi sa stargli accanto. Per questo le prime volte si passa più tempo vicino all'animale che in sella: lo si osserva, lo si tocca, si impara a leggerne i segnali. Sembra tempo perso ma non lo è: quando poi si sale, il cavallo lo si conosce già.

      In struttura non c'è solo la scuola: ci si occupa anche dell'addestramento dei cavalli giovani e della rieducazione di quelli che ne hanno bisogno.

      Chi monta da anni può saltare questa parte e passare direttamente alle [passeggiate sulle Orobie](/equitazione/passeggiate-orobie/).
