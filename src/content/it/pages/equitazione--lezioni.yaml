    intro: |
      Alla scuola di equitazione di Albosaggia non si comincia dalla sella. Chi non è mai salito a cavallo parte da terra: conosce l'animale, impara a stargli accanto, a condurlo e sale quando è pronto. Vale per gli adulti come per i ragazzi, dai 12 anni in su. Le lezioni si fanno in struttura su appuntamento.
