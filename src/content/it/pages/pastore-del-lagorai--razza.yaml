  title: "Pastore della Lessinia e Lagorai: razza, carattere e origini"
  description: "Il Pastore della Lessinia e del Lagorai: storia, carattere e lavoro con il gregge del cane da pastore del Nord-Est, e perché non è un cane per tutti."
