  - type: "text"
    kicker: "Il carattere"
    heading: "Carattere"
    body: |
      Lo standard dell'ENCI lo descrive come un cane di tipo lupoide, di taglia media, agile ma con una muscolatura forte. È rustico: lavora con qualunque tempo, su terreni ripidi e pieni di ostacoli, e lo fa con disinvoltura. Ha di solito orecchie erette o semierette e pelo semilungo, e fra i mantelli ce n'è uno che si riconosce subito, il blue merle, grigio marezzato di scuro.

      Di carattere è vivace e collaborativo: lavora insieme al pastore, più che per lui. Per questo oggi lo si incontra anche negli sport cinofili, dove serve un cane attento e pronto. C'è chi lo chiama il Border Collie italiano.
  - type: "text"
    kicker: "Il lavoro"
    heading: "Il lavoro in montagna"
    body: |
      Fra i pastori è un cane «paratore»: tiene unito il gregge, lo sposta, lo ferma, seguendo i cenni di chi lo guida. La sua terra sono le montagne e le prealpi del Nord-Est, dalla Lombardia orientale al Trentino-Alto Adige, al Veneto e al Friuli, e le strade della transumanza che da lì scendono in pianura lungo i grandi fiumi: l'Adige, il Brenta, il Piave, il Tagliamento. In questo lavoro è usato ancora oggi.

      Il riconoscimento è arrivato dopo anni di impegno degli appassionati. I cani vengono censiti nei raduni, valutati dai giudici e iscritti in un registro che l'ENCI ha aperto nel 2020. È un riconoscimento italiano; l'obiettivo dichiarato dagli allevatori è quello internazionale.

      Non lavora solo con le pecore: lo si usa anche con le mucche e con i cavalli. Da noi lo stesso istinto si vede ogni giorno al recinto: vedi la sezione [Equitazione](/equitazione/).
  - type: "cta-contact"
    kicker: "Contatti"
    heading: "Hai domande sulla razza?"
    body: |
      I nostri cani non sono in vendita e non vendiamo cuccioli. Se però la razza ti incuriosisce, chiamaci: ne parliamo volentieri.
