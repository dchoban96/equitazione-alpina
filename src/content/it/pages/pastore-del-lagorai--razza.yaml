    title: "Il Pastore del Lagorai: carattere e origini"
    intro: |
      Il suo nome ufficiale è Cane da Pastore della Lessinia e del Lagorai, ma quasi tutti lo chiamano Pastore del Lagorai, dalla catena di montagne del Trentino orientale. È un cane da gregge di taglia media, agile e resistente, che da secoli accompagna la transumanza fra le montagne e le pianure del Nord-Est. Per molto tempo è stato considerato un semplice meticcio dei pastori; dal 2020 è una razza riconosciuta dall'ENCI, la prima nata in Trentino.
