blocks:
  - type: "hero"
    kicker: "La razza"
    title: "Il Pastore della Lessinia e del Lagorai: un cane, una storia, un territorio"
    intro: |
      Il suo nome è Cane da Pastore della Lessinia e del Lagorai, dalla catena di montagne del Trentino orientale. È il cane della tradizione pastorale del Nord-Est: per generazioni ha accompagnato i pastori nel governo degli animali e nella transumanza da un pascolo all'altro. Conoscerlo vuol dire conoscere anche le persone e le montagne che lo hanno selezionato.
    image: "@assets/foto/pastore-blue-merle-profilo.jpg"
    imageAlt: "Il profilo di un Pastore della Lessinia e del Lagorai blue merle"
  - type: "facts"
    items:
      - label: "Origine"
        value: "Alpi e prealpi del Nord-Est"
      - label: "Tipo"
        value: "Lupoide, taglia media"
      - label: "Lavoro"
        value: "Conduzione del gregge"
      - label: "Riconoscimento"
        value: "ENCI, percorso in corso"
  - type: "text-image"
    kicker: "L'aspetto"
    heading: "Più di un bel mantello"
    body: |
      Lo standard lo descrive come un cane di tipo lupoide, rustico, agile e muscoloso, con orecchie erette o semierette e pelo semilungo. Il mantello può essere unicolore — nero, marrone nelle tonalità che vanno dal cannella al castagna, oppure sabbia, con maschera più scura e/o sella — o pluricolore, nei tipi grigio merle e red merle. In questi ultimi, macchie irregolari grigie, nere e/o marroni, color fegato o camoscio si distribuiscono su una base grigio porcellana.

      Chi lo incontra spesso si ferma ad ammirarlo. Ma il suo valore non si misura dal colore del mantello: risiede nelle attitudini selezionate dai pastori nel corso delle generazioni e nella storia della razza.
    image: "@assets/foto/foto-be08e1ad-209d-49e9-90af-346e02d65dce.jpg"
    alt: "Primo piano di un Pastore della Lessinia e del Lagorai mantello unicolore nero"
    side: "right"
  - type: "text"
    kicker: "Il lavoro"
    heading: "Un cane da lavoro, non un cane qualsiasi"
    body: |
      Tra i cani da pastore, è un «paratore»: mantiene unito il gregge, impedisce che gli animali si disperdano e li accompagna negli spostamenti. Un compito che richiede attenzione costante, capacità di leggere il terreno e il comportamento degli animali, oltre a prontezza d’iniziativa.

      La sua terra è quella delle montagne e delle Prealpi del Nord-Est: dalla Lombardia orientale al Trentino-Alto Adige, al Veneto e al Friuli. Il suo territorio comprende anche le vie della transumanza che scendono verso la pianura lungo l’Adige, il Brenta, il Piave e il Tagliamento. Lavora con pecore e capre, ma anche con bovini e cavalli. Da noi, questa attitudine si manifesta ogni giorno in maneggio, vedi la sezione [Equitazione](/equitazione/).
  - type: "text-image"
    kicker: "Il carattere"
    heading: "Collabora, ma sa anche decidere"
    body: |-
      Il cane da pastore collabora con chi lo guida: ne coglie i segnali, osserva ciò che accade nell'ambiente intorno e sa prendere iniziative quando serve. In lui, ascolto e autonomia convivono.

      Per questo educarlo non significa soltanto insegnargli cosa fare, ma anche imparare a comprenderlo. La relazione si costruisce giorno dopo giorno, con pazienza e consapevolezza.
    image: "@assets/foto/pastore-blue-merle-sul-prato.jpg"
    alt: "Un Pastore della Lessinia e del Lagorai blue merle sul prato, attento"
    side: "left"
    focus: "25% 50%"
  - type: "cards"
    kicker: "Senza gregge"
    heading: "Non avete un gregge? Si può valorizzare lo stesso"
    style: "tiles"
    items:
      - title: "Esplorazione"
        text: "Passeggiate ed esplorazioni all'aperto, su terreni sempre diversi."
      - title: "Ricerca olfattiva"
        text: "Attività come il mantrailing, la ricerca di una persona seguendone l'odore."
      - title: "Sport cinofili"
        text: "Discipline come l'agility dog e l'obedience, dove contano attenzione e collaborazione."
  - type: "text"
    kicker: "Prima di sceglierlo"
    heading: "Affascinante, ma non è un cane per tutti"
    body: |
      Molti Pastori della Lessinia e del Lagorai oggi non svolgono più il lavoro per cui sono stati selezionati. È quindi importante proporre loro attività da fare insieme, pensate su misura per ciascun cane e capaci di tenerlo impegnato sia mentalmente sia fisicamente.

      Vivere con un cane da lavoro richiede tempo, impegno e un percorso educativo, oltre a una relazione da costruire giorno dopo giorno. Prima di sceglierlo per il suo aspetto, è importante chiedersi se il suo temperamento e le sue esigenze siano compatibili con il proprio stile di vita.
  - type: "text"
    kicker: "Conoscere per tutelare"
    heading: "Il percorso di riconoscimento"
    body: |
      Per molto tempo è stato considerato un semplice meticcio dei pastori. Nel 2021 l'ENCI ne ha approvato lo standard, il primo per una razza nata in Trentino; da allora i cani vengono censiti nei raduni, valutati dai giudici e iscritti in un registro aperto. Il percorso verso il riconoscimento ufficiale è ancora in corso.

      A portarlo avanti è la SIPaLL, la Società Italiana Pastore della Lessinia e del Lagorai, che lavora per far conoscere la razza, documentarne le caratteristiche e diffondere una scelta responsabile: [pastorelessinialagorai.it](https://www.pastorelessinialagorai.it).
  - type: "cta-contact"
    kicker: "Contatti"
    heading: "Hai domande sulla razza?"
    body: |
      Se la razza ti incuriosisce, chiamaci: ne parliamo volentieri.
