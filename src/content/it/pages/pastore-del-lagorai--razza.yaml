blocks:
  - type: "hero"
    kicker: "La razza"
    title: "Il Pastore della Lessinia e del Lagorai: un cane, una storia, un territorio"
    intro: |
      Il suo nome è Cane da Pastore della Lessinia e del Lagorai; dalla catena di montagne del Trentino orientale. È il cane della tradizione pastorale del Nord-Est: per generazioni ha accompagnato i pastori nel governo degli animali e nella transumanza da un pascolo all'altro. Conoscerlo vuol dire conoscere anche le persone e le montagne che lo hanno selezionato.
    image: "@assets/foto/pastore-blue-merle-profilo.jpg"
    imageAlt: "Il profilo di un Pastore della Lessinia e del Lagorai blue merle"
  - type: "facts"
    items:
      - label: "Origine"
        value: "Alpi e prealpi del Nord-Est"
      - label: "Tipo"
        value: "Lupoide, taglia media"
      - label: "Lavoro"
        value: "Conduzione del gregge"
      - label: "Riconoscimento"
        value: "ENCI, percorso in corso"
  - type: "text-image"
    kicker: "L'aspetto"
    heading: "Più di un bel mantello"
    body: |
      Lo standard lo descrive come un cane di tipo lupoide, rustico, agile e muscoloso, con orecchie erette o semierette e pelo semilungo. Il mantello può essere unicolore: nero e marrone, nella varie tonalità (da cannella a castagna) e Sabbia con maschera più scura e/o sella. Poi c'è il mantello pluricolore: grigio merle e red merle (grigio, nero o/e marrone, fegato, camoscio a macchie irregolari, su base grigio porcellana).

      Chi lo incontra si ferma spesso a guardarlo. Il suo valore però non sta nel colore: sta nelle attitudini che i pastori hanno cercato per generazioni e nella storia della sua selezione.
    image: "@assets/foto/foto-be08e1ad-209d-49e9-90af-346e02d65dce.jpg"
    alt: "Primo piano di un Pastore della Lessinia e del Lagorai mantello unicolore nero"
    side: "right"
  - type: "text"
    kicker: "Il lavoro"
    heading: "Un cane da lavoro, non un cane qualsiasi"
    body: |
      Fra i pastori è un cane «paratore»: tiene unito il gregge, evita che gli animali si disperdano e lo accompagna negli spostamenti. È un lavoro che chiede attenzione continua, capacità di adattarsi al terreno e agli animali, e iniziativa.

      La sua terra sono le montagne e le prealpi del Nord-Est, dalla Lombardia orientale al Trentino-Alto Adige, al Veneto e al Friuli, e le strade della transumanza che da lì scendono in pianura lungo l'Adige, il Brenta, il Piave e il Tagliamento. Lavora con pecore e capre, ma anche con mucche e cavalli: da noi lo stesso istinto si vede ogni giorno al recinto, vedi la sezione [Equitazione](/equitazione/).
  - type: "text-image"
    kicker: "Il carattere"
    heading: "Collabora, ma sa anche decidere"
    body: |
      Un cane da pastore lavora in coppia con chi lo guida: segue i cenni, ma tiene d'occhio l'ambiente e risponde da solo quando la situazione lo richiede. Collaborazione e autonomia, in lui, vanno insieme.

      Per questo non basta insegnargli che cosa fare: bisogna imparare a capirlo. Il rapporto si costruisce con calma e consapevolezza, giorno dopo giorno.
    image: "@assets/foto/pastore-blue-merle-sul-prato.jpg"
    alt: "Un Pastore del Lagorai blue merle sul prato, attento"
    side: "left"
    focus: "25% 50%"
  - type: "cards"
    kicker: "Senza gregge"
    heading: "Non avete un gregge? Si può valorizzare lo stesso"
    style: "tiles"
    items:
      - title: "Esplorazione"
        text: "Passeggiate ed esplorazioni all'aperto, su terreni sempre diversi."
      - title: "Ricerca olfattiva"
        text: "Attività come il mantrailing, la ricerca di una persona seguendone l'odore."
      - title: "Sport cinofili"
        text: "Discipline come l'obedience, dove contano attenzione e collaborazione."
  - type: "text"
    kicker: "Prima di sceglierlo"
    heading: "Affascinante, ma non è un cane per tutti"
    body: |
      Molti Pastori della Lessinia e del Lagorai non fanno il lavoro per cui sono stati selezionati purché abbiano altro da fare: attività condivise, pensate sul singolo cane, che lo tengano occupato con la testa e con il corpo.

      Vivere con un cane da lavoro chiede tempo, impegno, educazione e una relazione costruita ogni giorno. Prima di sceglierlo per la sua bellezza, conviene chiedersi se il suo modo di essere va d'accordo con il proprio stile di vita.
  - type: "text"
    kicker: "Conoscere per tutelare"
    heading: "Il percorso di riconoscimento"
    body: |
      Per molto tempo è stato considerato un semplice meticcio dei pastori. Nel 2020 l'ENCI ne ha approvato lo standard, il primo per una razza nata in Trentino; da allora i cani vengono censiti nei raduni, valutati dai giudici e iscritti in un registro aperto. Il percorso verso il riconoscimento ufficiale è ancora in corso.

      A portarlo avanti è la SIPaLL, la Società Italiana Pastore della Lessinia e del Lagorai, che lavora per far conoscere la razza, documentarne le caratteristiche e diffondere una scelta responsabile: [pastorelessinialagorai.it](https://www.pastorelessinialagorai.it).
  - type: "cta-contact"
    kicker: "Contatti"
    heading: "Hai domande sulla razza?"
    body: |
      Se la razza ti incuriosisce, chiamaci: ne parliamo volentieri.
    form: false
