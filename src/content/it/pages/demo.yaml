# Phase 0 demo page: every block once, with demonstration text.
# Not indexed, not in the menu or the sitemap. Altitudes are the ones already
# published on the current home page (500 m Albosaggia, ~1300 m Orobie,
# ~1950 m Valmalenco).
slug: demo
title: Demo dei blocchi
section: demo
draft: false
noindex: true
nav: { hidden: true }
seo:
  title: Demo dei blocchi · Equitazione Alpina
  description: Pagina di prova con tutti i blocchi del sito. Non indicizzata.
  image: ../../../assets/segnaposto/segnaposto.jpg
altimeter: { enabled: true, min: 500, max: 1950 }
blocks:
  - type: hero
    altitude: 500
    coordinates: "Albosaggia · Valtellina — 46°16′N 9°84′E"
    kicker: Blocco hero
    title: Tutti i blocchi del sito, in una pagina
    intro: |
      Testo introduttivo dimostrativo. Ogni pagina del sito è una sequenza di blocchi scritti in un file di contenuto: qui ne compare uno per tipo, nell'ordine in cui si usano più spesso.
    closing: Scorri la pagina e guarda l'altimetro salire.
    footnote: Si sale da 500 a 1950 m
    ridges: fixed
    image: ../../../assets/segnaposto/segnaposto.jpg
    imageAlt: "Segnaposto: foto di apertura in arrivo"
    panelKicker: Scheda dati
    panel:
      - { label: Ora, value: "06:20" }
      - { label: Quota, value: 500 m }
      - { label: Stagione, value: Fine estate }
      - { label: Luogo, value: Albosaggia }

  - type: text
    anchor: testo
    altitude: 500
    kicker: Blocco testo
    heading: Testo lungo con titolo e sopratitolo
    body: |
      Primo paragrafo dimostrativo. Il testo arriva dal file di contenuto in formato Markdown: si possono usare **grassetto**, *corsivo* e [collegamenti](#mappa).

      Secondo paragrafo dimostrativo. La nota accanto al sopratitolo mostra la quota del blocco quando non se ne scrive un'altra.

  - type: facts
    altitude: 700
    kicker: Blocco dati
    heading: Una riga di dati essenziali
    items:
      - { label: Etichetta, value: Valore uno }
      - { label: Etichetta, value: Valore due }
      - { label: Etichetta, value: Valore tre }
      - { label: Etichetta, value: Valore quattro }

  - type: text-image
    altitude: 900
    kicker: Blocco testo e foto
    heading: Foto a destra
    side: right
    body: |
      Testo dimostrativo accanto a una foto. La foto può stare a destra, a sinistra, sotto il testo o sotto il testo in sovrapposizione.
    image: ../../../assets/segnaposto/segnaposto.jpg
    alt: "Segnaposto: foto in arrivo"
    caption: Didascalia dimostrativa della foto

