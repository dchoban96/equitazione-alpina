  - type: "text"
    kicker: "La giornata"
    heading: "Com'è una giornata in quota"
    body: |
      Gli itinerari sono diversi. Per chi comincia ci sono uscite di un’ora o di qualche ora; chi vuole la giornata intera sale fino alla conca dell’Alpe Palù, con il suo lago, e si ferma a pranzo in quota, in rifugio o in malga, con i piatti della valle. Si va al passo, e ci si ferma quando lo chiedono i cavalli.

      Le mete cambiano con la stagione e con l’esperienza di chi monta. Sopra il Lago Palù si raggiunge il Rifugio Motta, sugli alpeggi che guardano il gruppo del Bernina. Da Chiareggio si entra nelle valli più selvagge dell’alta Valmalenco: verso il Rifugio Gerli-Porro all’Alpe Ventina, di fronte al ghiacciaio e al Monte Disgrazia, oppure verso il Rifugio Tartaglione-Crispo, tra i larici della Val Sissone. Chi preferisce l’atmosfera dell’alpeggio sale alla Malga Rundai, dove il pranzo sa di formaggio d’alpe e polenta. E poi il Rifugio Lago Palù, il Rifugio Ventina: ogni trekking a cavallo in Valmalenco ha il suo rifugio dove legare i cavalli e sedersi a tavola.
