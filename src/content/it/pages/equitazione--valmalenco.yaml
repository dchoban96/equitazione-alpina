    alt: "Discesa con i cavalli dopo un pranzo in rifugio, con le pareti rocciose della Valmalenco sullo sfondo"
    body: |
      Gli itinerari si adattano all’esperienza e al tempo a disposizione. Chi è alle prime uscite può scegliere un percorso di un’ora o di qualche ora; per chi desidera trascorrere un’intera giornata in sella, la conca dell’Alpe Palù è una meta speciale: il lago e i colori della montagna fanno da cornice a una sosta in rifugio o in malga, tra i piatti autentici della valle.

      Le mete cambiano con il passo di chi monta. Dal Lago Palù si raggiunge il Rifugio Motta, tra gli alpeggi affacciati sul gruppo del Bernina. Da Chiareggio, invece, si aprono gli itinerari più selvaggi dell’alta Valmalenco: verso il Rifugio Gerli-Porro, all’Alpe Ventina, con il ghiacciaio e il Monte Disgrazia sullo sfondo, oppure verso il Rifugio Tartaglione-Crispo, tra i larici della Val Sissone.
      Per chi ama l’atmosfera dell’alpeggio c’è la Malga Rundai, dove il pranzo profuma di formaggio d’alpe e polenta. E poi ci sono il Rifugio Lago Palù e il Rifugio Ventina: ogni trekking a cavallo in Valmalenco trova il suo luogo di sosta, dove lasciare i cavalli e sedersi a tavola.
