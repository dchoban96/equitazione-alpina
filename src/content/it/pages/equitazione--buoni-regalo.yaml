  - type: "text"
    kicker: "Il buono"
    heading: "Come funziona"
    body: |
      Scrivici o chiamaci e dicci quale esperienza vuoi regalare: ti mandiamo il buono via email. Chi lo riceve ci chiama, e il giorno si sceglie insieme, guardando il tempo e la stagione.

      Validità 6 mesi dall'acquisto. Per le esperienze in Valmalenco, che si svolgono da fine giugno a inizio settembre, la scadenza si estende fino alla prima stagione utile.
