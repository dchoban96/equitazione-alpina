    intro: |
      Si parte dal recinto di Albosaggia e si sale nei boschi del versante orobico, dentro il Parco delle Orobie Valtellinesi, con la valle che si apre sotto man mano che si guadagna quota. Le uscite durano un'ora o più: per chi comincia ci sono i percorsi brevi, per chi ha esperienza i trekking di uno o più giorni.
