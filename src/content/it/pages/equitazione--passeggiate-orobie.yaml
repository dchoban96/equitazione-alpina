  - type: "text-image"
    kicker: "Per chi"
    heading: "Chi può venire"
    body: |
      L'uscita verso San Bernardo è la più semplice, adatta anche a chi non ha allenamento: si sale per una mulattiera nel bosco di latifoglie fino ai prati, piani e soleggiati.

      Quella verso il Lago Casera è un'altra cosa. È riservata a cavalli e cavalieri ben allenati, e in cambio attraversa tutti gli ambienti del parco e arriva dove si vedono il Monte Disgrazia e il gruppo del Bernina.

      Chi non è mai salito in sella comincia con una breve introduzione al cavallo, oppure dalle [lezioni](/equitazione/lezioni/).

      Per conoscere il versante a piedi c'è la nostra guida ad [Albosaggia e le Orobie](/valtellina/albosaggia-e-orobie/).
