  - type: "text"
    kicker: "Caratteristiche"
    heading: "Una capra di montagna"
    body: |
      Le corna si allargano di lato alla base e risalgono verso l'alto in punta. Le orecchie sono dritte, mai pendenti, e la barba, folta nei maschi, c'è spesso anche nelle femmine. Il mantello cambia molto da un animale all'altro: grigio, beige, nero, marrone o pezzato, spesso più scuro dietro e più chiaro davanti.

      Vive nelle Alpi Orobie e nelle prealpi vicine: in provincia di Sondrio in Val Gerola e nelle valli accanto, in provincia di Lecco in Valsassina e in Val Varrone, in provincia di Bergamo nell'alta Val Brembana. Si alleva in modo tradizionale, al pascolo in primavera e in autunno e in alpeggio d'estate.

      È una razza a duplice attitudine, da latte e da carne. Con il latte si fanno piccoli formaggi di valle, come il matuscin in Valtellina e il formagìn in Valsassina, e una parte finisce nello Storico Ribelle, il formaggio d'alpeggio delle valli del Bitto. Fra i salumi c'è il violino di capra.

      Un tempo ce n'erano in ogni casa. Poi sono arrivate razze più produttive, molti allevatori hanno smesso, e l'Orobica si è ridotta a pochi greggi: per questo oggi è tutelata da un Presidio Slow Food e ha un libro genealogico, tenuto dall'Associazione Nazionale della Pastorizia.

      Dei formaggi parliamo nella pagina [Formaggi](/valtellina/cibo-e-vino/formaggi/).

      Accanto alle capre vivono i nostri cavalli: vedi la sezione [Equitazione](/equitazione/).
