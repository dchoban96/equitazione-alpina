    intro: |
      La Capra Orobica, detta anche di Val Gerola, è la capra delle Alpi Orobie. Di taglia media, si riconosce da lontano: corna molto lunghe, appiattite e leggermente ritorte, presenti anche nelle femmine, e un mantello di pelo lungo. La sua origine non è documentata con certezza; l'ipotesi più accreditata è che venga proprio dalla Val Gerola, in provincia di Sondrio, dove l'isolamento l'ha resa diversa dalle altre capre.
    image: "@assets/foto/mockup-capra-ritratto.jpg"
