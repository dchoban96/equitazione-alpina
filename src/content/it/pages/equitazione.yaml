  - type: "text-image"
    kicker: "Come si va"
    heading: "Andare al passo"
    body: |-
      Qui non si corre. La montagna ha i suoi tempi, e i cavalli chiedono di rispettarli.

      Chi non è mai salito a cavallo comincia da terra: impara a conoscere l’animale, stargli accanto, a sentirsi a proprio agio con lui e in sella si sale quando si è pronti. Chi invece cavalca già da anni può esplorare sentieri che invitano a prendersi un’intera giornata.

      Le uscite in sella sono aperte dai 12 anni. Ognuno trova il proprio ritmo: la prima volta può bastare camminare accanto al cavallo. È già un buon inizio.
    image: "@assets/foto/foto-img-2628.jpg"
    alt: |-
      Non è solo un accompagnatore: ogni cavallo è protagonista delle nostre passeggiate in montagna.
      È un vero e proprio appuntamento, che si rinnova durante tutto l’anno tra sentieri, paesaggi e il ritmo delle stagioni.
