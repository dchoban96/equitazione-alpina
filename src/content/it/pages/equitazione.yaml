    intro: |
      Equitazione Alpina è il maneggio di Simone De Capitani ad Albosaggia, a dieci minuti da Sondrio, dove comincia il Parco delle Orobie Valtellinesi. Qui i cavalli vivono all'aperto e si esce al passo sui sentieri di casa, tutto l'anno. Da fine giugno a inizio settembre ci si sposta in Valmalenco, verso l'Alpe Palù. Simone lavora con i cavalli da oltre trent'anni ed è accompagnatore di turismo equestre SEF Italia – C.O.N.I.
