# Short "Lo sapevi?" facts. `sections` lists where each may appear.
# MOCKUP: general facts, to be checked by the owner before launch.
items:
  - id: "pizzoccheri"
    text: "I pizzoccheri si fanno con farina di grano saraceno, coltivato in Valtellina da secoli."
    sections:
      - "home"
      - "valtellina"
  - id: "grigioni"
    text: "Dal 1512 al 1797 la Valtellina fu governata dalle Tre Leghe dei Grigioni."
    sections:
      - "valtellina"
  - id: "val-gerola"
    text: "La Capra Orobica è chiamata anche capra di Val Gerola, da una delle valli delle Orobie."
    sections:
      - "capra-orobica"
      - "home"
  - id: "lagorai"
    text: "Già dal 1285 i documenti d'archivio seguono i pastori del Nord-Est lungo le vie della transumanza: per muovere greggi di migliaia di capi senza danneggiare i campi, il cane da conduzione era insostituibile."
    sections:
      - "pastore-del-lagorai"
  - id: "demo"
    text: "Testo dimostrativo del riquadro «Lo sapevi?». Qui andrà una curiosità breve, con la sua fonte verificata."
    sections:
      - "demo"
