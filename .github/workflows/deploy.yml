# Builds the site and publishes it to Cloudflare Pages (project
# "equitazione-alpina", served at www.equitazione-alpina.it). Runs on every
# push to main, including each Pubblica from the panel.
# The production build fails while a published page still shows a
# [DA COMPLETARE] marker, so an incomplete edit never goes live.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare API token
# with Account > Cloudflare Pages > Edit).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bf8670cc44ccaf2e7fb3ea3a3b90ea64 # not a secret: it is in every dashboard address
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the sitemap dates each page by its last commit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # the control panel's API (worker/pannello.js on Cloudflare); public, not a secret
          PUBLIC_PANNELLO_API: https://pannello-equitazione-alpina.dchoban96.workers.dev
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=equitazione-alpina --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
